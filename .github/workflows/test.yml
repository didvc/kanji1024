name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: make check
      - name: command line round trip
        run: |
          head -c 4099 /dev/urandom > sample.bin
          node bin/kanji1024.mjs --seal --group 4 --wrap 40 sample.bin | node bin/kanji1024.mjs --decode | cmp - sample.bin
